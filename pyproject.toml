[project]
name = "netsec-lang"
version = "0.1.0"
description = "A typed language for network checks and verifiable firewall policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "loguru>=0.7.3,<0.8",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "tenacity>=9,<10",
]

[project.scripts]
netsec = "netsec.cli:main"

[tool.poetry]
packages = [{ include = "netsec", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
mypy = "^1.19"
pytest = "^9.1"
pytest-cov = "^6.0"
pre-commit = "^4.0"
detect-secrets = "^1.5"
poethepoet = "^0.32"

[tool.poe.tasks]
fmt = "ruff format ."
lint = "ruff check --fix ."
types = "mypy src/"
test = "pytest -q"
scan = "python -m netsec.quality"
editor-types = "npm --prefix editor/vscode run check"
editor-test = "npm --prefix editor/vscode test"
gate = ["fmt", "lint", "types", "test", "scan", "editor-types", "editor-test"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "ARG", "PTH", "ERA", "PL", "RUF", "S", "C90"]
ignore = ["D107", "D203", "D213", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D103", "D104", "PLR2004", "ARG001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=netsec --cov-report=term-missing"
filterwarnings = ["error"]
