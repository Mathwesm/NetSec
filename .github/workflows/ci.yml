name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editor/vscode/package-lock.json
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install Python dependencies
        run: poetry install --no-interaction
      - name: Install editor development dependencies
        run: npm --prefix editor/vscode ci --ignore-scripts
      - name: Run the same local quality gate
        run: poetry run poe gate
      - name: Reject formatting drift
        run: git diff --exit-code
      - name: Package the editor extension
        if: runner.os == 'Linux'
        run: npm --prefix editor/vscode run package
      - name: Upload the installable extension
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: netsec-vscode
          path: editor/vscode/*.vsix

  network-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry and dependencies
        run: |
          pipx install poetry==2.4.1
          poetry install --no-interaction
      - name: Start the isolated laboratory
        run: docker compose -f lab/compose.yaml up -d --build
      - name: Validate real network behavior
        run: poetry run netsec lab-test
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-evidence
          path: data/processed/
      - name: Stop the laboratory
        if: always()
        run: docker compose -f lab/compose.yaml stop

  professional-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          pipx install poetry==2.4.1
          poetry install --no-interaction
      - name: Start isolated SSH targets
        run: docker compose -f lab/professional/compose.yaml up -d --build
      - name: Validate native firewall, pinned SSH and DNS
        run: poetry run python lab/professional/validate.py
      - name: Validate encrypted WireGuard traffic and owned teardown
        run: poetry run python lab/professional/validate_vpn.py
      - name: Upload professional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-network-evidence
          path: data/processed/
      - name: Stop owned laboratory
        if: always()
        run: docker compose -f lab/professional/compose.yaml stop

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          pipx install poetry==2.4.1
          poetry install --no-interaction
      - name: Exercise native rule lifecycle on disposable elevated runner
        run: poetry run python lab/professional/validate_windows.py --apply
      - name: Build self-contained Windows installer
        shell: powershell
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler is unavailable on this runner' }
          ./packaging/windows/build.ps1 -Compiler $compiler
      - name: Smoke test per-user installation in a path with spaces
        shell: powershell
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Recurse -Filter 'NetSec-0.2.0-Windows-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer output is missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'NetSec installation smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $destination + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Per-user installer failed' }
          & (Join-Path $destination 'cli/NetSec.exe') check examples/05_functions.netsec
          if ($LASTEXITCODE -ne 0) { throw 'Installed compiler smoke test failed' }
          & (Join-Path $destination 'cli/NetSec.exe') doctor
          if ($LASTEXITCODE -ne 0) { throw 'Installed native bridge smoke test failed' }
          $desktop = Start-Process -FilePath (Join-Path $destination 'NetSec-Desktop.exe') -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if ($desktop.HasExited) { throw 'Installed desktop exited unexpectedly' }
          Stop-Process -Id $desktop.Id
      - name: Upload native evidence and installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netsec-windows
          path: |
            data/processed/
            dist/**/installer/*.exe
